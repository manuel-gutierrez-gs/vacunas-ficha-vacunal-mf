<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="Description" content="no-description" />
    <title>Vacunas Ficha Vacunal Mf</title>

    <link rel="stylesheet" href="style.css" />
    <script type="module" src="/src/index.ts"></script>
  </head>

  <body>
    <div style="border-bottom: 1px dashed grey; padding: 10px">
      <select id="nuhsaSelect">
        <option value="AN0496015662" selected>AN0496015662</option>
        <option value="AN1561112451">AN1561112451</option>
        <option value="AN0602654735">AN0602654735</option>
        <option value="AN0571703247">AN0571703247</option>
        <option value="AN0962044886">AN0962044886</option>
      </select>

      <button id="toggleHeader">Toggle cabecera</button>
    </div>

    <vacunas-ficha-vacunal-mf id="mf" nuhsa="AN0496015662"> </vacunas-ficha-vacunal-mf>

    <script>
      const mf = document.getElementById('mf');
      const select = document.getElementById('nuhsaSelect');
      const toggle = document.getElementById('toggleHeader');
      let headerVisible = true;

      select.addEventListener('change', e => {
        mf.nuhsa = e.target.value;
      });

      toggle.addEventListener('click', () => {
        headerVisible = !headerVisible;
        mf.hasHeader = headerVisible;
        toggle.textContent = headerVisible ? 'Ocultar cabecera' : 'Mostrar cabecera';
      });
    </script>
  </body>
</html>
