<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="Description" content="no-description" />
    <base href="/" />
    <title>Vacunas Ficha Vacunal Mf</title>

    <link rel="stylesheet" href="style.css" />
    <script type="module" src="/src/index.ts"></script>
  </head>

  <body>
    <!-- <vacunas-ficha-vacunal-mf id="mf" nuhsa="AN0496015662"></vacunas-ficha-vacunal-mf> -->
    <vacunas-ficha-vacunal-mf id="mf" nuhsa="AN1561112451"></vacunas-ficha-vacunal-mf>
    <!-- <vacunas-ficha-vacunal-mf id="mf" nuhsa="AN0602654735"></vacunas-ficha-vacunal-mf> -->
    <!-- <vacunas-ficha-vacunal-mf id="mf" nuhsa="AN0571703247"></vacunas-ficha-vacunal-mf> -->

    <div id="log"></div>
    <script>
      const log = document.getElementById('log');
      const mf = document.getElementById('mf');
      const append = (line) => {
        log.textContent += line + '\n';
      };
      mf.addEventListener('vacunas-ficha-vacunal-mf:loaded', (e) => {
        append('loaded: ' + JSON.stringify(e.detail));
      });
      mf.addEventListener('vacunas-ficha-vacunal-mf:error', (e) => {
        append('error: ' + JSON.stringify(e.detail));
      });
      mf.addEventListener('vacunas-ficha-vacunal-mf:card-selected', (e) => {
        append('card-selected: ' + JSON.stringify(e.detail));
      });
    </script>
  </body>
</html>
