<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="Description" content="no-description" />
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Arquetipo Front</title>
    <link rel="stylesheet" href="style.css" />
    <script src="./src/index.ts" type="module"></script>
  </head>

  <body>
    <style>
      body {
        position: relative;
      }
      #output {
      position: absolute;
      top: 0;
      right: 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #f0f0f0;
      z-index: 1000;
      }
    </style>
    <stic-example-mf ruta="/errores" texto="Prueba de texto manolo"></stic-example-mf>
    <div id="output">Esperando evento...</div>

    <script>
      const mf = document.querySelector('stic-example-mf');
      const output = document.querySelector('#output');
  
      mf.addEventListener('stic-mf:warning:click', () => {
        output.textContent = 'Evento warning recibido desde el microfrontend';
      });

      mf.addEventListener('stic-mf:error:click', () => {
        output.textContent = 'Evento error recibido desde el microfrontend';
      });
    
    </script>
  </body>
</html>
